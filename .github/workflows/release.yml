name: Release

# Builds the Aster Vault desktop application and NSIS installer on a native
# Windows (MSVC) runner, then uploads them to a GitHub Release.
#
# NOTE: This workflow becomes runnable once the application icon set exists in
# src-tauri/icons (Phase 7). Tauri's build embeds the icons at compile time.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci
      - run: npm run build

      - name: Build Tauri app + NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/release/bundle/nsis/*.exe release-assets/ 2>/dev/null || true
          cp target/release/aster-vault.exe release-assets/ 2>/dev/null || true
          ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: true
          generate_release_notes: true
