[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/vault-core",
    "crates/vault-recovery-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
base64 = "0.23"
rand = "0.8"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }

# Release profile optimized for a small, hardened Windows binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
